# The whole game on one machine: Caddy serves the page on port 80 and passes
# the game's traffic to the match server, which isn't exposed on its own.
#   docker compose up -d --build
# With a domain pointed at the machine, set SITE_ADDRESS (e.g. in a .env file)
# to it and open port 443 too: Caddy then gets an HTTPS certificate itself.
services:
  server:
    build: { context: ., target: server }
    restart: unless-stopped
    # The SQLite database with accounts, ratings and match history.
    volumes: [game-data:/data]
    environment:
      # Most players in online matches at once; the rest wait in the queue.
      MAX_PLAYERS: ${MAX_PLAYERS:-500}
      # Card payments for gems; off until all three are set in .env.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SITE_URL: ${SITE_URL:-}
      # Password for the stats dashboard at /admin.html; the dashboard is off without it.
      ADMIN_KEY: ${ADMIN_KEY:-}

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes: [caddy-data:/data]
    depends_on: [server]

volumes:
  caddy-data:
  game-data:
